<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Хан Кадашов · Профиль</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Manrope',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}

:root{
  --ease:cubic-bezier(0.22,1,0.36,1);
  --spring:cubic-bezier(0.34,1.56,0.64,1);

  /* Цвета из раздела чатов и звонков */
  --bg-base:#07091a;
  --bg-1:#1a1240;
  --bg-2:#052033;
  --bg-3:#3a0c2b;
  --ink:#f0f2ff;
  --ink-soft:#b8bdd6;
  --ink-mute:#757b95;
  --accent:#8b7dff;
  --accent-soft:rgba(139,125,255,0.18);
  --success:#34d399;
  --danger:#f87171;
  --care:#ff8aa0;
  --shield:#2dd4bf;
  --divider:rgba(255,255,255,0.08);

  /* Градиенты из чатов/звонков */
  --grad-aurora:linear-gradient(135deg,#6a5cff 0%,#00d4ff 48%,#ff6ad5 100%);
  --grad-violet:linear-gradient(135deg,#8b5cf6 0%,#ec4899 100%);
  --grad-mint:linear-gradient(135deg,#00f0a8 0%,#00b4d8 100%);
  --grad-shield:linear-gradient(135deg,#10b981 0%,#06b6d4 100%);
  --grad-care:linear-gradient(135deg,#ff9a62 0%,#ff5d8f 100%);

  /* Жидкое стекло — из conv-body и bubble */
  --glass:rgba(20,22,40,0.55);
  --glass-strong:rgba(28,32,56,0.80);
  --glass-soft:rgba(255,255,255,0.04);
  --border:rgba(255,255,255,0.12);
  --inner:inset 0 1px 0 rgba(255,255,255,0.08),inset 0 -1px 0 rgba(0,0,0,0.2);
  --shadow:0 30px 80px -30px rgba(0,0,0,0.6),0 8px 24px -12px rgba(0,0,0,0.4);
  --bubble-out:linear-gradient(135deg,rgba(106,92,255,0.95),rgba(139,125,255,0.85));
}

/* ── Фон — aurora из conv-body ── */
body{
  background:
    radial-gradient(1200px 600px at 10% -10%,var(--bg-1) 0%,transparent 60%),
    radial-gradient(900px 600px at 90% 0%,var(--bg-2) 0%,transparent 55%),
    radial-gradient(800px 500px at 50% 110%,var(--bg-3) 0%,transparent 55%),
    var(--bg-base);
  color:var(--ink);
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;
}

/* ── Телефонный фрейм ── */
.phone{
  width:390px;min-height:100vh;
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  background:var(--bg-base);
}

/* Aurora-блобы — то, что размывает backdrop-filter */
.blobs{position:fixed;inset:0;width:390px;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.75}
.blob-1{width:320px;height:320px;top:-80px;left:-60px;background:radial-gradient(circle,#6a5cff 0%,transparent 70%)}
.blob-2{width:280px;height:280px;top:60px;right:-80px;background:radial-gradient(circle,#00d4ff 0%,transparent 70%)}
.blob-3{width:260px;height:260px;top:200px;left:30px;background:radial-gradient(circle,#ff6ad5 0%,transparent 70%)}
.blob-4{width:300px;height:300px;top:420px;right:-40px;background:radial-gradient(circle,#8b5cf6 0%,transparent 70%)}
.blob-5{width:240px;height:240px;bottom:160px;left:-40px;background:radial-gradient(circle,#00f0a8 0%,transparent 70%)}
.blob-6{width:200px;height:200px;bottom:60px;right:20px;background:radial-gradient(circle,#ec4899 0%,transparent 70%)}

.phone>*:not(.blobs){position:relative;z-index:1}

/* ── Жидкое стекло ── */
.glass{
  background:rgba(15,12,40,0.35);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:22px;
  box-shadow:var(--shadow),var(--inner),inset 0 0 0 0.5px rgba(255,255,255,0.08);
  backdrop-filter:blur(28px) saturate(200%) brightness(1.1);
  -webkit-backdrop-filter:blur(28px) saturate(200%) brightness(1.1);
}
.glass-strong{
  background:rgba(10,8,30,0.45);
  border:1px solid rgba(255,255,255,0.22);
  border-radius:22px;
  box-shadow:var(--shadow),var(--inner),inset 0 0 0 0.5px rgba(255,255,255,0.1);
  backdrop-filter:blur(48px) saturate(220%) brightness(1.15);
  -webkit-backdrop-filter:blur(48px) saturate(220%) brightness(1.15);
}

/* Глобальная прозрачность иконок */
.icon-btn svg, .tab svg, .nav-tab svg, .btn svg, .story-new-ring svg { opacity: 0.35; }

/* Liquid highlight — из design-supermessenger */
.liquid{position:relative;overflow:hidden;isolation:isolate}
.liquid::before{
  content:'';position:absolute;inset:-40%;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(139,125,255,0.28) 0%,rgba(139,125,255,0) 38%);
  opacity:0;transition:opacity .4s var(--ease);pointer-events:none;z-index:0;
}
.liquid:hover::before{opacity:1}
.liquid>*{position:relative;z-index:1}

/* ── Шапка ── */
.header{
  padding:52px 20px 16px;
  display:flex;align-items:center;gap:12px;
  position:relative;
  background:rgba(7,9,26,0.3);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,0.07);
}
.header-name{font-size:22px;font-weight:800;letter-spacing:-0.02em;flex:1}
.icon-btn{
  width:42px;height:42px;border-radius:14px;border:none;cursor:pointer;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  color:rgba(255,255,255,0.35);display:grid;place-items:center;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  transition:all .25s var(--ease);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
}
.icon-btn:hover{color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.1)}

/* ── Аватар + статистика ── */
.profile-hero{
  padding:0 20px 20px;
  display:flex;align-items:flex-end;gap:20px;
}
.avatar-wrap{position:relative;flex:none}
.avatar{
  width:80px;height:80px;border-radius:50%;
  background:var(--grad-aurora);
  display:grid;place-items:center;
  font-size:32px;font-weight:800;color:white;
  box-shadow:0 16px 40px -12px rgba(106,92,255,0.7);
  border:3px solid var(--bg-base);
}
.avatar-add{
  position:absolute;bottom:0;right:0;
  width:24px;height:24px;border-radius:50%;
  background:var(--grad-aurora);
  border:2px solid var(--bg-base);
  display:grid;place-items:center;
  cursor:pointer;
}

.stats{display:flex;gap:24px;flex:1;justify-content:flex-end;padding-bottom:8px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat-num{font-size:17px;font-weight:800;letter-spacing:-0.02em}
.stat-label{font-size:11px;color:var(--ink-mute);font-weight:500}

/* ── Кнопки действий ── */
.actions{padding:0 20px 20px;display:flex;gap:10px}
.btn{
  flex:1;padding:11px 16px;border-radius:14px;border:none;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:700;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.16);
  color:rgba(255,255,255,0.55);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 4px 16px rgba(0,0,0,0.3);
  transition:transform .2s var(--spring),box-shadow .25s var(--ease),background .2s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,0.13)}
.btn:active{transform:scale(.97)}

/* ── Истории ── */
.stories{padding:0 20px 20px;display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.story-ring{
  width:64px;height:64px;border-radius:50%;
  padding:2px;
  background:var(--grad-aurora);
  cursor:pointer;
}
.story-inner{
  width:100%;height:100%;border-radius:50%;
  background:var(--bg-base);
  display:grid;place-items:center;
  border:2px solid var(--bg-base);
  overflow:hidden;
}
.story-new{
  background:var(--glass-strong);
  border:1px dashed var(--border);
  background:none;
}
.story-new-ring{
  width:64px;height:64px;border-radius:50%;
  background:var(--glass-strong);
  border:1px dashed var(--border);
  display:grid;place-items:center;
  cursor:pointer;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.story-label{font-size:11px;color:var(--ink-soft);font-weight:500;text-align:center;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Табы ── */
.tabs{
  display:flex;border-bottom:1px solid rgba(255,255,255,0.08);
  position:sticky;top:0;z-index:10;
  background:rgba(7,9,26,0.25);
  backdrop-filter:blur(32px) saturate(200%);
  -webkit-backdrop-filter:blur(32px) saturate(200%);
}
.tab{
  flex:1;padding:14px 0;border:none;background:transparent;cursor:pointer;
  color:rgba(255,255,255,0.18);display:grid;place-items:center;
  position:relative;transition:color .25s var(--ease);
}
.tab[data-active="true"]{color:var(--accent)}
.tab[data-active="true"]::after{
  content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;
  border-radius:2px;background:var(--grad-aurora);
}

/* ── Сетка публикаций ── */
.grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:2px;
  padding-bottom:100px;
}
.post{
  aspect-ratio:1;overflow:hidden;cursor:pointer;position:relative;
}
.post img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s var(--ease)}
.post:hover img{transform:scale(1.05)}
.post-placeholder{
  width:100%;height:100%;
  background:var(--glass-soft);
  border:1px solid var(--border);
}

/* ── Нижний таббар — из mobileTabbar ── */
.tabbar{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  width:362px;padding:8px 16px;
  display:flex;align-items:center;justify-content:space-around;
  border-radius:999px;
  background:rgba(10,8,30,0.4);
  border:1px solid rgba(255,255,255,0.18);
  box-shadow:0 30px 80px -30px rgba(0,0,0,0.6),0 8px 24px -12px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.12);
  backdrop-filter:blur(48px) saturate(220%) brightness(1.1);
  -webkit-backdrop-filter:blur(48px) saturate(220%) brightness(1.1);
  z-index:100;
}
.nav-tab{
  border:none;background:transparent;cursor:pointer;
  padding:8px 12px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:rgba(255,255,255,0.18);font-family:inherit;font-size:10px;font-weight:600;
  transition:all .25s var(--spring);
}
.nav-tab[data-active="true"]{color:var(--accent);transform:translateY(-2px)}
.nav-tab svg{transition:transform .25s var(--spring)}
.nav-tab[data-active="true"] svg{filter:drop-shadow(0 0 6px rgba(139,125,255,0.6))}

/* ── Анимации ── */
@keyframes reveal{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.reveal{animation:reveal .5s var(--ease) both}
.reveal-2{animation:reveal .5s .08s var(--ease) both}
.reveal-3{animation:reveal .5s .16s var(--ease) both}
.reveal-4{animation:reveal .5s .24s var(--ease) both}
</style>
</head>
<body>
<div class="phone">

  <!-- Aurora blobs — основа для glass-эффекта -->
  <div class="blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="blob blob-5"></div>
    <div class="blob blob-6"></div>
  </div>

  <!-- Шапка -->
  <div class="header reveal">
    <span class="header-name">Хан Кадашов</span>
    <button class="icon-btn liquid" onmousemove="liq(event)" title="Аналитика">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
    </button>
    <button class="icon-btn liquid" onmousemove="liq(event)" title="QR-код">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-7M17 21h.01"/></svg>
    </button>
    <button class="icon-btn liquid" onmousemove="liq(event)" title="Настройки">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 2.6 14H2a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4 7l-.1-.1A2 2 0 1 1 6.7 4.1l.1.1A1.6 1.6 0 0 0 9 4.6V4a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 17 7l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1Z"/></svg>
    </button>
  </div>

  <!-- Аватар + статистика -->
  <div class="profile-hero reveal-2">
    <div class="avatar-wrap">
      <div class="avatar">X</div>
      <div class="avatar-add">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>
    <div class="stats">
      <div class="stat">
        <span class="stat-num">1</span>
        <span class="stat-label">публикации</span>
      </div>
      <div class="stat">
        <span class="stat-num">1</span>
        <span class="stat-label">подписчики</span>
      </div>
      <div class="stat">
        <span class="stat-num">2</span>
        <span class="stat-label">подписки</span>
      </div>
    </div>
  </div>

  <!-- Кнопки -->
  <div class="actions reveal-3">
    <button class="btn glass liquid" onmousemove="liq(event)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
      Редактировать профиль
    </button>
    <button class="btn glass liquid" onmousemove="liq(event)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5 8.6 10.5"/></svg>
      Поделиться профилем
    </button>
  </div>

  <!-- Истории -->
  <div class="stories reveal-4">
    <div class="story">
      <div class="story-new-ring liquid" onmousemove="liq(event)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <span class="story-label">Новое</span>
    </div>
  </div>

  <!-- Табы -->
  <div class="tabs">
    <button class="tab" data-active="true" data-id="grid" onclick="switchTab(this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
    </button>
    <button class="tab" data-id="video" onclick="switchTab(this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4 20 12 6 20Z"/></svg>
    </button>
    <button class="tab" data-id="mentions" onclick="switchTab(this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>
    </button>
    <button class="tab" data-id="saved" onclick="switchTab(this)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
    </button>
  </div>

  <!-- Сетка публикаций -->
  <div class="grid" id="postsGrid">
    <!-- Одна реальная публикация -->
    <div class="post" style="background:#1a1a2e">
      <div style="width:100%;height:100%;background:linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);display:flex;align-items:center;justify-content:center">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      </div>
    </div>
  </div>

</div>

<!-- Нижний таббар -->
<div class="tabbar">
  <button class="nav-tab" data-id="feed">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>Лента</span>
  </button>
  <button class="nav-tab" data-id="video">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m22 8-6 4 6 4Z"/></svg>
    <span>Видео</span>
  </button>
  <button class="nav-tab" data-id="notif">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
    <span>Уведомления</span>
  </button>
  <button class="nav-tab" data-id="chats">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5Z"/></svg>
    <span>Чаты</span>
  </button>
  <button class="nav-tab" data-active="true" data-id="profile">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    <span>Звонки</span>
  </button>
</div>

<script>
function liq(e){
  const r=e.currentTarget.getBoundingClientRect();
  e.currentTarget.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
  e.currentTarget.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
}

function switchTab(btn){
  document.querySelectorAll('.tabs .tab').forEach(t=>t.dataset.active='false');
  btn.dataset.active='true';
}

// Liquid на всех .liquid элементах
document.querySelectorAll('.liquid').forEach(el=>el.addEventListener('mousemove',liq));
</script>
</body>
</html>
