<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mansoni · Halo — дизайн супер-мессенджера 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* =====================================================================
   mansoni · HALO DESIGN LANGUAGE 2026
   Три оси: Продвинутость · Безопасность · Забота
   - Продвинутость: жидкое стекло, aurora-градиенты, глубина и блики
   - Безопасность: шифрование/щиты/верификация как первичный визуальный слой
   - Забота: мягкие формы, спокойные интервалы, тёплые акценты, ясная микрокопия
   ===================================================================== */

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

:root {
  --radius-xs: 12px;
  --radius-sm: 16px;
  --radius-md: 22px;
  --radius-lg: 30px;
  --radius-xl: 40px;
  --pill: 999px;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* Aurora — продвинутость */
  --grad-aurora: linear-gradient(135deg, #6a5cff 0%, #00d4ff 48%, #ff6ad5 100%);
  --grad-violet: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
  --grad-mint:   linear-gradient(135deg, #00f0a8 0%, #00b4d8 100%);
  /* Shield — безопасность */
  --grad-shield: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
  /* Care — забота (тёплый янтарь/коралл) */
  --grad-care:   linear-gradient(135deg, #ff9a62 0%, #ff5d8f 100%);

  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased;
}

body[data-theme="dark"] {
  --bg-1: #1a1240; --bg-2: #052033; --bg-3: #3a0c2b; --bg-base: #07091a;
  --ink: #f0f2ff; --ink-soft: #b8bdd6; --ink-mute: #757b95;
  --glass: rgba(20,22,40,0.55);
  --glass-strong: rgba(28,32,56,0.80);
  --glass-soft: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.12);
  --inner: inset 0 1px 0 rgba(255,255,255,0.08), inset 0 -1px 0 rgba(0,0,0,0.2);
  --shadow: 0 30px 80px -30px rgba(0,0,0,0.6), 0 8px 24px -12px rgba(0,0,0,0.4);
  --input-bg: rgba(255,255,255,0.06);
  --divider: rgba(255,255,255,0.08);
  --accent: #8b7dff; --accent-soft: rgba(139,125,255,0.18);
  --success: #34d399; --danger: #f87171; --warning: #fbbf24; --shield: #2dd4bf; --care: #ff8aa0;
  --bubble-in: rgba(255,255,255,0.07);
  --bubble-out: linear-gradient(135deg, rgba(106,92,255,0.95), rgba(139,125,255,0.85));
}
body[data-theme="light"] {
  --bg-1: #f6f4ff; --bg-2: #e8f2ff; --bg-3: #fff0f6; --bg-base: #f3f4fb;
  --ink: #0e1530; --ink-soft: #4b5266; --ink-mute: #8089a0;
  --glass: rgba(255,255,255,0.55);
  --glass-strong: rgba(255,255,255,0.82);
  --glass-soft: rgba(255,255,255,0.55);
  --border: rgba(255,255,255,0.7);
  --inner: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(14,21,48,0.04);
  --shadow: 0 20px 60px -20px rgba(80,60,160,0.25), 0 8px 24px -12px rgba(14,21,48,0.12);
  --input-bg: rgba(255,255,255,0.7);
  --divider: rgba(14,21,48,0.08);
  --accent: #6a5cff; --accent-soft: rgba(106,92,255,0.14);
  --success: #10b981; --danger: #ef4444; --warning: #f59e0b; --shield: #0d9488; --care: #ff5d8f;
  --bubble-in: rgba(255,255,255,0.85);
  --bubble-out: linear-gradient(135deg, #6a5cff, #8b7dff);
}

body {
  min-height: 100vh;
  color: var(--ink);
  padding: 24px 16px 96px;
  background:
    radial-gradient(1200px 600px at 10% -10%, var(--bg-1) 0%, transparent 60%),
    radial-gradient(900px 600px at 90% 0%, var(--bg-2) 0%, transparent 55%),
    radial-gradient(800px 500px at 50% 110%, var(--bg-3) 0%, transparent 55%),
    var(--bg-base);
  transition: background 0.6s var(--ease), color 0.4s var(--ease);
}

/* ── Glass surfaces ─────────────────────────────────────── */
.glass {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow), var(--inner);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
}
.glass-strong {
  background: var(--glass-strong);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow), var(--inner);
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
}

/* Liquid highlight */
.liquid { position: relative; overflow: hidden; isolation: isolate; }
.liquid::before {
  content:''; position:absolute; inset:-40%;
  background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.32) 0%, rgba(255,255,255,0) 38%);
  opacity:0; transition:opacity .4s var(--ease); pointer-events:none; z-index:0;
}
body[data-theme="dark"] .liquid::before {
  background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(139,125,255,0.28) 0%, rgba(139,125,255,0) 38%);
}
.liquid:hover::before { opacity:1; }
.liquid > * { position:relative; z-index:1; }

/* ── Top control bar ────────────────────────────────────── */
.topbar {
  max-width: 1320px; margin: 0 auto; padding: 14px 18px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.brand { display:flex; align-items:center; gap:12px; }
.brand-logo {
  width:40px; height:40px; border-radius:13px; background: var(--grad-aurora);
  box-shadow: 0 10px 28px -10px rgba(106,92,255,0.7);
  display:grid; place-items:center; color:white; font-weight:800; font-size:18px;
}
.brand-title { font-weight:800; font-size:16px; letter-spacing:-0.02em; }
.brand-sub { font-size:11px; color:var(--ink-mute); }
.spacer { flex:1; }

.seg { display:inline-flex; gap:2px; padding:4px; border-radius:var(--pill);
  background: var(--glass-soft); border:1px solid var(--border); }
.seg button {
  border:none; cursor:pointer; padding:8px 14px; border-radius:var(--pill);
  font-size:13px; font-weight:600; background:transparent; color:var(--ink-soft);
  transition: all .25s var(--ease); font-family:inherit;
}
.seg button[data-active="true"] { background: var(--grad-aurora); color:white; box-shadow:0 6px 16px -6px rgba(106,92,255,0.5); }

.navchips { display:flex; gap:6px; flex-wrap:wrap; }
.chip {
  width:42px; height:42px; border-radius:14px; border:1px solid var(--border);
  background:var(--glass-soft); color:var(--ink-soft); cursor:pointer;
  display:grid; place-items:center; transition: all .25s var(--ease);
}
.chip[data-active="true"] { background:var(--accent-soft); color:var(--accent); border-color:transparent; transform:translateY(-1px); }
.chip:hover { color:var(--ink); }

/* ── Device frame ───────────────────────────────────────── */
.stage { margin-top:26px; display:flex; justify-content:center; }
.frame { padding:10px; border-radius:var(--radius-xl); background:var(--glass-strong);
  border:1px solid var(--border); box-shadow:var(--shadow); }
.frame[data-vp="desktop"] { width:100%; max-width:1320px; }
.frame[data-vp="mobile"] { width:392px; }
.frame-inner { border-radius:var(--radius-lg); overflow:hidden; position:relative; background:transparent; }
.frame[data-vp="desktop"] .frame-inner { height:760px; }
.frame[data-vp="mobile"] .frame-inner { height:760px; }

/* ── Buttons ───────────────────────────────────────────── */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; cursor:pointer; font-family:inherit; font-weight:700; font-size:14px;
  padding:12px 18px; border-radius:var(--radius-sm); color:var(--ink);
  background:var(--glass-soft); border:1px solid var(--border);
  transition: transform .2s var(--spring), box-shadow .25s var(--ease), background .25s var(--ease);
}
.btn:hover { transform:translateY(-2px); }
.btn:active { transform:translateY(0) scale(.98); }
.btn-primary { background:var(--grad-aurora); color:white; border-color:transparent; box-shadow:0 14px 30px -12px rgba(106,92,255,0.6); }
.btn-shield  { background:var(--grad-shield); color:white; border-color:transparent; box-shadow:0 14px 30px -12px rgba(16,185,129,0.5); }
.btn-care    { background:var(--grad-care); color:white; border-color:transparent; box-shadow:0 14px 30px -12px rgba(255,93,143,0.5); }
.btn-ghost   { background:transparent; }
.btn-block { width:100%; }
.btn-icon { width:44px; height:44px; padding:0; border-radius:14px; }

/* ── Badges & pills ────────────────────────────────────── */
.badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
  padding:4px 10px; border-radius:var(--pill); }
.badge-grad { background:var(--grad-aurora); color:white; }
.badge-shield { background:rgba(16,185,129,0.16); color:var(--shield); }
.badge-care { background:rgba(255,93,143,0.16); color:var(--care); }
.badge-soft { background:var(--glass-soft); color:var(--ink-soft); border:1px solid var(--border); }

.dot { width:9px; height:9px; border-radius:50%; }
.dot-online { background:var(--success); box-shadow:0 0 0 3px color-mix(in srgb, var(--success) 25%, transparent); }

/* ── Avatar ─────────────────────────────────────────────── */
.avatar { border-radius:50%; display:grid; place-items:center; color:white; font-weight:700;
  background:var(--grad-violet); position:relative; flex:none; }
.avatar[data-online="true"]::after {
  content:''; position:absolute; right:-1px; bottom:-1px; width:30%; height:30%;
  background:var(--success); border-radius:50%; border:2.5px solid var(--bg-base);
}
.av-ring { padding:2px; border-radius:50%; background:var(--grad-aurora); }

/* ── Inputs ─────────────────────────────────────────────── */
.field { width:100%; padding:13px 16px; border-radius:var(--radius-sm);
  background:var(--input-bg); border:1px solid var(--border); color:var(--ink);
  font-family:inherit; font-size:14px; outline:none; transition: border .2s var(--ease), box-shadow .2s var(--ease); }
.field::placeholder { color:var(--ink-mute); }
.field:focus { border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }

/* ── Layout helpers ─────────────────────────────────────── */
.row { display:flex; align-items:center; gap:12px; }
.col { display:flex; flex-direction:column; }
.muted { color:var(--ink-mute); }
.soft { color:var(--ink-soft); }
.divider { height:1px; background:var(--divider); }
.scroll { overflow-y:auto; scrollbar-width:thin; }
.scroll::-webkit-scrollbar { width:8px; }
.scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:8px; }
.truncate { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ── App shell (desktop) ────────────────────────────────── */
.appshell { display:grid; grid-template-columns:84px 340px 1fr; height:100%; }
.rail { padding:16px 0; display:flex; flex-direction:column; align-items:center; gap:10px;
  border-right:1px solid var(--divider); }
.rail-logo { width:46px; height:46px; border-radius:15px; background:var(--grad-aurora);
  display:grid; place-items:center; color:white; font-weight:800; font-size:20px;
  box-shadow:0 10px 26px -10px rgba(106,92,255,0.7); }
.rail-item { width:52px; height:52px; border-radius:16px; display:grid; place-items:center;
  color:var(--ink-mute); cursor:pointer; position:relative; transition: all .25s var(--ease); }
.rail-item:hover { color:var(--ink); background:var(--glass-soft); }
.rail-item[data-active="true"] { color:var(--accent); background:var(--accent-soft); }
.rail-item[data-active="true"]::before { content:''; position:absolute; left:-16px; top:14px; bottom:14px; width:3px;
  border-radius:3px; background:var(--grad-aurora); }
.rail-badge { position:absolute; top:8px; right:8px; min-width:16px; height:16px; padding:0 4px;
  border-radius:8px; background:var(--care); color:white; font-size:10px; font-weight:800; display:grid; place-items:center; }

.panel { border-right:1px solid var(--divider); display:flex; flex-direction:column; min-width:0; }
.panel-head { padding:18px 18px 14px; display:flex; flex-direction:column; gap:14px; }
.panel-title { font-size:22px; font-weight:800; letter-spacing:-0.02em; }
.searchwrap { position:relative; }
.searchwrap svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-mute); }
.searchwrap .field { padding-left:42px; }

.content { display:flex; flex-direction:column; min-width:0; }

/* ── Chat list ──────────────────────────────────────────── */
.chatitem { display:flex; gap:12px; padding:12px 16px; cursor:pointer; border-radius:var(--radius-sm);
  margin:2px 8px; transition: background .2s var(--ease); position:relative; }
.chatitem:hover { background:var(--glass-soft); }
.chatitem[data-active="true"] { background:var(--accent-soft); }
.chatitem .meta { flex:1; min-width:0; }
.chatitem .top { display:flex; align-items:center; gap:6px; }
.chatitem .name { font-weight:700; font-size:14px; }
.chatitem .time { margin-left:auto; font-size:11px; color:var(--ink-mute); }
.chatitem .preview { font-size:13px; color:var(--ink-soft); margin-top:2px; }
.unread { min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--grad-aurora);
  color:white; font-size:11px; font-weight:800; display:grid; place-items:center; }

/* ── Conversation ───────────────────────────────────────── */
.conv-head { padding:14px 18px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--divider); }
.conv-body { flex:1; padding:20px; display:flex; flex-direction:column; gap:12px;
  background:
    radial-gradient(600px 300px at 80% 0%, var(--accent-soft) 0%, transparent 60%),
    radial-gradient(500px 300px at 0% 100%, rgba(255,106,213,0.06) 0%, transparent 60%); }
.bubble { max-width:64%; padding:11px 15px; border-radius:20px; font-size:14px; line-height:1.45;
  box-shadow:0 6px 18px -10px rgba(0,0,0,0.3); position:relative; }
.bubble.in { background:var(--bubble-in); border-bottom-left-radius:7px; align-self:flex-start;
  border:1px solid var(--border); }
.bubble.out { background:var(--bubble-out); color:white; border-bottom-right-radius:7px; align-self:flex-end; }
.bubble .stamp { font-size:10px; margin-top:5px; opacity:.7; display:flex; gap:4px; align-items:center; justify-content:flex-end; }
.day-sep { align-self:center; font-size:11px; color:var(--ink-mute); padding:4px 12px; border-radius:var(--pill);
  background:var(--glass-soft); border:1px solid var(--border); }

.e2ee-note { align-self:center; max-width:80%; text-align:center; font-size:12px; color:var(--shield);
  background:rgba(16,185,129,0.10); border:1px solid rgba(16,185,129,0.25); padding:8px 14px;
  border-radius:var(--radius-sm); display:flex; gap:8px; align-items:center; }

.composer { padding:12px 16px; display:flex; align-items:center; gap:10px; border-top:1px solid var(--divider); }
.composer .field { border-radius:var(--pill); }

/* ── Cards / sections ───────────────────────────────────── */
.card { padding:18px; border-radius:var(--radius-md); }
.section-pad { padding:22px; }
.h-title { font-size:24px; font-weight:800; letter-spacing:-0.02em; margin:0; }
.h-sub { color:var(--ink-soft); font-size:14px; margin:4px 0 0; }

.secrow { display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:var(--radius-sm);
  background:var(--glass-soft); border:1px solid var(--border); }
.secicon { width:42px; height:42px; border-radius:13px; display:grid; place-items:center; color:white; flex:none; }

.toggle { width:48px; height:28px; border-radius:var(--pill); background:var(--input-bg);
  border:1px solid var(--border); position:relative; cursor:pointer; transition:background .25s var(--ease); flex:none; }
.toggle::after { content:''; position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%;
  background:white; transition: transform .28s var(--spring); box-shadow:0 2px 6px rgba(0,0,0,0.25); }
.toggle[data-on="true"] { background:var(--grad-shield); border-color:transparent; }
.toggle[data-on="true"]::after { transform:translateX(20px); }

/* Security gauge */
.gauge { display:flex; align-items:center; gap:16px; }
.gauge-ring { width:96px; height:96px; border-radius:50%; flex:none; display:grid; place-items:center;
  background: conic-gradient(var(--shield) 0% 92%, var(--input-bg) 92% 100%); position:relative; }
.gauge-ring::after { content:''; position:absolute; inset:9px; border-radius:50%; background:var(--glass-strong); }
.gauge-num { position:relative; z-index:1; font-weight:800; font-size:24px; }

/* Mobile tabbar */
.tabbar { position:absolute; left:14px; right:14px; bottom:16px; padding:8px;
  display:flex; align-items:center; justify-content:space-around; border-radius:var(--pill); }
.tab { border:none; background:transparent; cursor:pointer; padding:9px 12px; border-radius:14px;
  display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-mute);
  font-family:inherit; font-size:10px; font-weight:600; transition: all .25s var(--spring); }
.tab[data-active="true"] { color:var(--accent); transform:translateY(-2px); }
.fab { width:50px; height:50px; border-radius:50%; border:none; cursor:pointer; background:var(--grad-aurora);
  color:white; display:grid; place-items:center; box-shadow:0 14px 30px -10px rgba(106,92,255,0.7); }

/* Call screen */
.call { height:100%; position:relative; display:flex; flex-direction:column;
  background: radial-gradient(700px 500px at 50% 20%, rgba(106,92,255,0.25) 0%, transparent 60%), var(--bg-base); }
.call-main { flex:1; display:grid; place-items:center; position:relative; }
.call-avatar { width:140px; height:140px; border-radius:50%; background:var(--grad-violet); display:grid; place-items:center;
  color:white; font-size:54px; font-weight:800; box-shadow:0 30px 80px -20px rgba(139,125,255,0.6);
  animation: breathe 4s var(--ease) infinite; }
@keyframes breathe { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.04); } }
.call-pip { position:absolute; right:18px; bottom:18px; width:110px; height:150px; border-radius:18px;
  background:var(--grad-mint); border:2px solid var(--border); box-shadow:var(--shadow); }
.call-controls { padding:24px; display:flex; align-items:center; justify-content:center; gap:14px; }
.call-btn { width:58px; height:58px; border-radius:50%; border:none; cursor:pointer; display:grid; place-items:center;
  background:var(--glass-strong); color:var(--ink); transition: transform .2s var(--spring); }
.call-btn:hover { transform:translateY(-3px); }
.call-btn.end { background:var(--danger); color:white; }

/* Showcase grid */
.showcase { max-width:1320px; margin:34px auto 0; }
.showcase h2 { font-size:14px; text-transform:uppercase; letter-spacing:0.12em; color:var(--ink-mute); margin:0 0 14px; }
.grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); }

.pillrow { display:flex; gap:8px; flex-wrap:wrap; }

/* Reveal animation */
.reveal { animation: reveal .5s var(--ease) both; }
@keyframes reveal { from { opacity:0; transform:translateY(14px) scale(.985); } to { opacity:1; transform:none; } }

.hidden { display:none !important; }

@media (max-width: 1000px) {
  .frame[data-vp="desktop"] { display:none; }
}
</style>
</head>
<body data-theme="dark">

<!-- ── TOP CONTROL BAR ─────────────────────────────────── -->
<div class="topbar glass-strong">
  <div class="brand">
    <div class="brand-logo">M</div>
    <div>
      <div class="brand-title">mansoni · Halo</div>
      <div class="brand-sub">Продвинутость · Безопасность · Забота — 2026</div>
    </div>
  </div>
  <div class="spacer"></div>

  <div class="seg" id="themeSeg">
    <button data-v="light">Светлая</button>
    <button data-v="dark" data-active="true">Тёмная</button>
  </div>
  <div class="seg" id="vpSeg">
    <button data-v="desktop" data-active="true">Desktop</button>
    <button data-v="mobile">Mobile</button>
  </div>

  <div class="navchips" id="navChips"></div>
</div>

<!-- ── DEVICE STAGE ────────────────────────────────────── -->
<div class="stage">
  <div class="frame" data-vp="desktop" id="frame">
    <div class="frame-inner" id="frameInner"></div>
  </div>
</div>

<!-- ── COMPONENT SHOWCASE ──────────────────────────────── -->
<div class="showcase">
  <h2>Язык дизайна · компоненты</h2>
  <div class="grid">

    <div class="glass card reveal">
      <div class="soft" style="font-size:12px; margin-bottom:12px; font-weight:700;">Кнопки</div>
      <div class="pillrow">
        <button class="btn btn-primary liquid" onmousemove="liquid(event)">Действие</button>
        <button class="btn btn-shield liquid" onmousemove="liquid(event)">Защитить</button>
        <button class="btn btn-care liquid" onmousemove="liquid(event)">Забота</button>
        <button class="btn">Обычная</button>
      </div>
    </div>

    <div class="glass card reveal">
      <div class="soft" style="font-size:12px; margin-bottom:12px; font-weight:700;">Статусы безопасности</div>

function desktopShell(){
  let main='', mid='';

  else if(state.section==='wallet'){ mid = simplePanel('Кошелёк','Stars и платежи'); main = walletCenter(); }
  else if(state.section==='security'){ mid = simplePanel('Безопасность','Центр защиты'); main = securityCenter(); }
  else if(state.section==='care'){ mid = simplePanel('Забота','Цифровое благополучие'); main = careCenter(); }
  else if(state.section==='profile'){ mid = simplePanel('Профиль','Ваш аккаунт'); main = profile(); }
  else { mid = settingsPanel(); main = settingsDetail(); }

  const shell = `<div class="appshell reveal">${rail()}${mid}<div class="content">${main}</div></div>`;

  return shell;
}

/* ── Mobile shell ───────────────────────────────────────── */
function mobileShell(){
  let body='';
  if(state.section==='chats') body = mobileChats();
  else if(state.section==='feed') body = `<div class="scroll" style="height:100%;padding-bottom:90px">${feedCenter()}</div>`;
  else if(state.section==='calls') body = `<div class="scroll" style="height:100%">${callScreenMobile()}</div>`;
  else if(state.section==='ai') body = `<div style="height:100%;padding-bottom:84px;display:flex;flex-direction:column">${aiCenter()}</div>`;
  else if(state.section==='wallet') body = `<div class="scroll" style="height:100%;padding-bottom:90px">${walletCenter()}</div>`;
  else if(state.section==='security') body = securityCenter();
  else if(state.section==='care') body = careCenter();
  else if(state.section==='profile') body = profile();
  else body = settingsDetail();

  const shell = `<div style="height:100%;display:flex;flex-direction:column;position:relative" class="reveal">
    <div style="flex:1;overflow:hidden;display:flex;flex-direction:column">${body}</div>
    ${mobileTabbar()}
  </div>`;
  setTimeout(bindTabs,0);
  return shell;
}
function mobileChats(){
  return `<div style="display:flex;flex-direction:column;height:100%">
    <div class="panel-head"><div class="row"><div class="panel-title">Чаты</div><div class="spacer"></div>
      <span class="badge badge-shield">${svg('lock',13)} E2EE</span></div>
      <div class="searchwrap">${svg('search',18)}<input class="field" placeholder="Поиск…"></div></div>
    <div class="scroll" style="flex:1;padding-bottom:90px">${CHATS.map(c=>chatItem(c,false)).join('')}</div>
  </div>`;
}
function callScreenMobile(){
  return `<div style="height:100%;padding-bottom:90px">${callScreen()}</div>`;
}
function mobileTabbar(){
  const tabs = SECTIONS.filter(s=>['chats','feed','calls','wallet','profile'].includes(s.id));
  const left = tabs.slice(0,2), right = tabs.slice(2,4);
  return `<div class="tabbar glass-strong">
    ${left.map(t=>tabBtn(t)).join('')}
    <button class="fab">${svg('plus',24)}</button>
    ${right.map(t=>tabBtn(t)).join('')}
  </div>`;
}
function tabBtn(t){ return `<button class="tab" data-id="${t.id}" data-active="${state.section===t.id}">${svg(t.icon,22)}<span>${t.label}</span></button>`; }
function bindTabs(){ document.querySelectorAll('#frameInner .tab').forEach(b=> b.onclick=()=>{ state.section=b.dataset.id; render(); }); }

render();
</script>
