# =============================================================================
# Supabase Proxy — обход блокировки supabase.co в РФ
# Домен: supabase-proxy.mansoni.ru
#
# Маршрутизация:
#   /          → lfkbgnbjxskspsownvjm.supabase.co (все пути)
#
# ВАЖНО: supabase-js меняет URL автоматически:
#   - HTTPS: https://supabase-proxy.mansoni.ru
#   - WebSocket: wss://supabase-proxy.mansoni.ru (realtime/websocket)
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=supabase_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=supabase_conn:10m;

# ---------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name supabase-proxy.mansoni.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------
# HTTPS server — универсальный proxy для всего supabase.co
# ---------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name supabase-proxy.mansoni.ru;

    # TLS — Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/supabase-proxy.mansoni.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase-proxy.mansoni.ru/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # CORS — только для mansoni.ru
    set $cors_origin "";
    if ($http_origin ~* "^https?://((.*\.)?mansoni\.ru)(:\d+)?$") {
        set $cors_origin $http_origin;
    }
    add_header Access-Control-Allow-Origin "$cors_origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID, ApiKey" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Preflight fast-path
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host lfkbgnbjxskspsownvjm.supabase.co;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Connection limit
    limit_conn supabase_conn 50;

    # -----------------------------------------------------------------
    # Health check
    # -----------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------
    # Все запросы к суpabase.co
    # -----------------------------------------------------------------
    location / {
        limit_req zone=supabase_api burst=50 nodelay;

        proxy_pass https://lfkbgnbjxskspsownvjm.supabase.co;
    }
}