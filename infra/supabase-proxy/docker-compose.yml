# =============================================================================
# Supabase Proxy — обход блокировки
# docker-compose для nginx-reverse-proxy
# =============================================================================

version: "3.8"

services:
  nginx-proxy:
    image: nginx:alpine
    container_name: supabase-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /var/cache/nginx:/var/cache/nginx
    networks:
      - proxy-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  proxy-net:
    driver: bridge