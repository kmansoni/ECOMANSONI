# coturn minimal config (dev)
# Production: set proper realm/server-name, external-ip, certs, and tighten relay port range.

# Listen
listening-ip=0.0.0.0
listening-ip=::
listening-port=3478
# TURN over TLS
tls-listening-port=5349
# TLS 1.2+ only (coturn default allows TLS 1.0 — explicitly disable legacy)
no-tlsv1
no-tlsv1_1

# Relay port range (keep narrow in dev)
# For better scalability, use: min-port=49152, max-port=65535
min-port=49152
max-port=65535

# Authentication (REST API / shared secret)
# Clients use:
#   username = <expiry unix seconds>
#   credential = base64(hmac-sha1(static-auth-secret, username))
use-auth-secret
# IMPORTANT: Replace with actual secret from Vault during deployment
# Generate: openssl rand -hex 32
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET

# Realm / server name
realm=local.mansoni
server-name=turn.local.mansoni
external-ip=127.0.0.1

# Security & hardening (baseline)
fingerprint
no-loopback-peers
no-multicast-peers
# Block RFC 1918 private ranges as TURN relay destinations.
# This prevents the TURN server from being used to pivot into internal networks.
# Includes CGNAT range (carrier-grade NAT) and full RFC1918 coverage.
denied-peer-ip=0.0.0.0/8
denied-peer-ip=10.0.0.0/8
denied-peer-ip=100.64.0.0/10
denied-peer-ip=127.0.0.0/8
denied-peer-ip=169.254.0.0/16
denied-peer-ip=172.16.0.0/12
denied-peer-ip=192.0.0.0/24
denied-peer-ip=192.168.0.0/16
denied-peer-ip=240.0.0.0/4
denied-peer-ip=::1/128
denied-peer-ip=fc00::/7

# Logs
verbose

# ─── Performance ─────────────────────────────────────────────────────────────
# Use separate process per CPU core (coturn multi-process mode)
# Automatically detected; set explicitly if needed: proc-user=turnserver
# Max session allocation per user (DoS protection)
max-allocate-lifetime=3600
channel-lifetime=600
permission-lifetime=300

# NOTE: In production you typically need:
#   external-ip=<PUBLIC_IP>
# Optional regional alternates:
#   alternate-server=turn-tr.mansoni.ru:3478
#   alternate-server=turn-ae.mansoni.ru:3478
# plus TLS certs:
#   cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
#   pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
