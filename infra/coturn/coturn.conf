# Coturn TURN/STUN Server Configuration
# For Mansoni Video Calls

# ===========================================
# General Settings
# ===========================================

# Run as daemon
daemonize=yes

# Bind address (0.0.0.0 for all interfaces)
listening-ip=0.0.0.0
listening-port=3478

# TLS listening port
tls-listening-port=5349

# External IP address (replace with your server's public IP)
# This is REQUIRED for TURN to work behind NAT
external-ip=YOUR_PUBLIC_IP_HERE

# Realm for authentication
realm=mansoni.ru

# Server name (for diagnostics)
server-name=mansoni-turn.mansoni.ru

# ===========================================
# Authentication
# ===========================================

# Use static long-term credentials
# Format: user=<username>:<password>
# Generate passwords with: openssl rand -base64 32
lt-cred-mech

# Enable anonymous access for STUN only (no relay)
# Enable only if you want anyone to be able to use STUN
# not-st

# Minimum and maximum port for relay allocation
min-port=49152
max-port=65535

# ===========================================
# Security
# ===========================================

# Disable UDP relay (uncomment to disable)
# no-udp

# Disable TCP relay (uncomment to disable)
# no-tcp

# Disable TLS (uncomment to disable)
# no-tls

# Disable DTLS (uncomment to disable)
# no-dtls

# Restrict to specific IPs (uncomment and configure)
# allowed-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255

# ===========================================
# Logging
# ===========================================

# Log file
log-file=/var/log/coturn/coturn.log

# Log to stdout (for Docker)
# stdout

# Verbose logging (uncomment for debugging)
# verbose

# ===========================================
# Performance
# ===========================================

# Total allocation capacity (number of ports * max-bps)
# Default is reasonable for most deployments
# total-quota=100

# Maximum bandwidth per relay (bps)
# max-bps=1000000

# ===========================================
# Stability
# ===========================================

# Stabilization period (seconds)
# During this time, bandwidth usage is tracked
# stable-time=3600

# Heartbeat interval (seconds)
# ping-time=60

# STUN binding request timeout
# stun-timeout=60

# ===========================================
# Prometheus Metrics (optional)
# ===========================================

# Enable Prometheus metrics endpoint
# prometheus

# ===========================================
# Additional Options
# ===========================================

# Enable fingerprints in STUN responses
fingerprint

# Use timestamps in logs
use-auth-secret-timestamps

# Enable message integrity
# message-integrity

# Don't rate limit STUN binding requests
no-stun-only

# Enable long-term credentials
lt-cred-mech

# RFC 5780 NAT behavior discovery support
# nat-detection

# ===========================================
# Emergency / Testing
# ===========================================

# Uncomment to run in debug mode (foreground)
# mini-realm

# Uncomment to disable relay functionality (STUN only)
# no-relay
