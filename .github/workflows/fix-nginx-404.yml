name: Fix nginx 404 (one-shot)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and fix nginx
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.ADMINVPS_HOST }}
          username: ${{ secrets.ADMINVPS_USER }}
          key: ${{ secrets.ADMINVPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.ADMINVPS_APP_DIR }}"

            echo "=== CURRENT LINK ==="
            ls -la "$APP_DIR/current" 2>/dev/null || echo "no current symlink"
            readlink -f "$APP_DIR/current" 2>/dev/null || echo "cannot resolve"

            echo "=== DIST DIR ==="
            ls "$APP_DIR/dist/" 2>/dev/null | head -5 || echo "no dist"

            echo "=== RELEASES ==="
            ls "$APP_DIR/releases/" 2>/dev/null || echo "no releases"

            echo "=== NGINX ROOT ==="
            grep -r "root " /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | grep -v "#" || echo "not found"

            echo "=== INDEX.HTML CHECK ==="
            REAL=$(readlink -f "$APP_DIR/current" 2>/dev/null || echo "")
            if [ -n "$REAL" ] && [ -f "$REAL/index.html" ]; then
              echo "index.html OK at $REAL"
            else
              echo "index.html MISSING at $REAL"
              # Try to find it
              find "$APP_DIR" -name "index.html" 2>/dev/null | head -5
            fi

            echo "=== FIX: create current symlink → dist ==="
            ln -sfn "$APP_DIR/dist" "$APP_DIR/current"
            echo "Symlink: $APP_DIR/current → $APP_DIR/dist"
            ls "$APP_DIR/current/index.html" && echo "index.html OK"

            sudo nginx -t && sudo systemctl reload nginx && echo "Nginx reloaded OK"

            echo "=== NGINX CONF CONTENT ==="
            cat /etc/nginx/sites-enabled/mansoni.ru 2>/dev/null || echo "not found"

            echo "=== NGINX STATUS ==="
            sudo systemctl status nginx --no-pager | head -10

            echo "=== SMOKE ==="
            sleep 2
            curl -sv http://localhost/ 2>&1 | grep -E "< HTTP|< Location|404|200|index" | head -10
