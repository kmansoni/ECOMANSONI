<!doctype html>

    <script>
      // GitHub Pages SPA fallback:
      // If the user hits a deep link, Pages serves /404.html which redirects to /?/<path>.
      // This script restores the original path so React Router can handle it.
      (function () {
        var l = window.location;
        if (l.search && l.search.startsWith('?/')) {
          var query = l.search.slice(2);
          
          // Prevent malformed URLs like ?/&/&/&... from infinite loops
          if (query.startsWith('&/&') || query.match(/(&\/){3,}/)) {
            // Corrupted URL - reset to home
            window.history.replaceState(null, '', l.pathname);
            return;
          }
          
          var parts = query.split('&');
          var path = parts.shift() || '';
          var remaining = parts.length ? ('?' + parts.join('&')) : '';
          var base = l.pathname;
          if (!base.endsWith('/')) base = base + '/';
          
          // Use replaceState to update browser history before React Router initializes
          // This ensures the router sees the original path, not the ?/ encoded version
          window.history.replaceState(null, '', base + path + remaining + l.hash);
        }
      })();
    </script>

    <script>
      // Service Worker registration — sw.js (media cache + push)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          var isLocalDev =
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1' ||
            window.location.hostname === '[::1]';

          if (isLocalDev) {
            Promise.all([
              navigator.serviceWorker.getRegistrations()
                .then(function (registrations) {
                  return Promise.all(registrations.map(function (registration) {
                    return registration.unregister();
                  }));
                }),
              'caches' in window
                ? caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (key) {
                      return caches.delete(key);
                    }));
                  })
                : Promise.resolve(),
            ])
              .then(function () {
                if (navigator.serviceWorker.controller && !sessionStorage.getItem('dev-sw-clean-reloaded')) {
                  sessionStorage.setItem('dev-sw-clean-reloaded', '1');
                  window.location.reload();
                } else {
                  sessionStorage.removeItem('dev-sw-clean-reloaded');
                }
              })
              .catch(function (err) {
                console.warn('[SW] Dev cleanup failed:', err);
              });
            return;
          }

          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function (registration) {
              // Проверяем обновление SW при каждой загрузке страницы
              registration.addEventListener('updatefound', function () {
                var newWorker = registration.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', function () {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // Новая версия SW готова — активируем немедленно
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(function (err) {
              console.warn('[SW] Registration failed:', err);
            });

          // При смене активного SW — перезагружаем страницу для применения нового кэша
          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
